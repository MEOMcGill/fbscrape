[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fbscrape"
version = "0.1.0"
description = "Facebook scraping library with account management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "camoufox>=0.4.0",
    "aiosqlite>=0.19.0",
    "click>=8.0.0",
    "tabulate>=0.9.0",
    "pika>=1.3.0",
    "pyarrow>=14.0.0",
    "polars>=1.0.0",
    "pyyaml>=6.0",
    "ijson>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
fbscrape = "fbscrape.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fbscrape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no network, no browser (default)",
    "integration: headless browser hitting real Facebook; needs an active account in db/accounts.db",
    "e2e: end-to-end CLI invocations via subprocess; needs an active account",
]
# Default invocation runs only unit tests. Use `pytest -m integration`,
# `pytest -m e2e`, or `pytest -m ''` (empty selector) to opt in.
addopts = "-m 'not integration and not e2e'"