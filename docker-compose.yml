services:
  scraper:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: fbscrape:latest
    ports:
      - "6080:6080"
    volumes:
      - ./db:/app/db
      - ./data:/app/data
      - ./auth:/app/auth
      - ./tmp:/app/tmp
    environment:
      - DISPLAY=:99
      - SCREEN_RES=1920x1080x24
    stdin_open: true
    tty: true
    shm_size: 24gb
    # --- resource limits (container-create-time; require `down` + `up -d`) ---
    cpus: 12.0            # cap at 12 of 16 cores; leaves 4 for host/OS
    mem_limit: 48g        # hard RAM cap; leaves ~14Gi for host + buff/cache
    memswap_limit: 48g    # == mem_limit → no swap (prevents renderer-wedging thrash)
    mem_reservation: 24g  # soft floor honored under host memory pressure
